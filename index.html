<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Avisos | E.E. Profª Silvana Evangelista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <span class="badge-seduc">Rede Estadual de Ensino</span>
            <h1>E.E. Profª Silvana Evangelista</h1>
            <p>Mural Oficial de Comunicados, Eventos e Avisos Escolares</p>
        </div>
    </header>

    <main class="container">
        <!-- Barra de Controles: Busca e Filtros -->
        <section class="controls">
            <input type="text" id="searchInput" placeholder="Buscar aviso por palavra-chave...">
            
            <div class="filter-buttons">
                <button class="filter-btn active" data-category="Todos">Todos</button>
                <button class="filter-btn" data-category="Urgente">Urgente</button>
                <button class="filter-btn" data-category="Pedagógico">Pedagógico</button>
                <button class="filter-btn" data-category="Secretaria">Secretaria</button>
                <button class="filter-btn" data-category="Eventos">Eventos</button>
            </div>
        </section>

        <!-- Lista de Avisos (Preenchida via JavaScript) -->
        <section id="avisosContainer" class="avisos-grid">
            <!-- Os cartões de aviso aparecerão aqui -->
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 E.E. Professora Silvana Evangelista - Todos os direitos reservados.</p>
            <p class="footer-sub">Protótipo de Mural Digital Estático</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
